name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily health check of the production deployment
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  e2e:
    # Cross-browser end-to-end tests against the live production deployment
    # (no secrets needed in CI: the deployment holds its own credentials).
    name: E2E production (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - Desktop Chrome
          - Desktop Firefox
          - Desktop Safari
          - Mobile Chrome
          - Mobile Safari
    env:
      PLAYWRIGHT_BASE_URL: https://vercel-daily-tau.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7
